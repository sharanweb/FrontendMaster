        q: "What is a closure in JavaScript? Can you define it in your own words?",
        answer: "A closure is a function that retains access to its lexical scope (the variables from its outer/enclosing function) even after that outer function has finished executing. The inner function 'closes over' the variables it needs.",

  let count = 0;         // This variable is "closed over"
  
  function inner() {
    count++;             // inner accesses outer's variable
    console.log(count);
  }
  
  return inner;          // outer has returned, but count lives on
}

const counter = outer(); // outer() done, count not garbage collected

        code: `let x = 'global';

function outer() {

  function inner() {

}

  let count = start;        // private variable

const c1 = makeCounter(10);

        q: "What is the classic 'var in a loop' closure bug? How do you fix it?",
        answer: "This is one of the most common MAANG interview questions on closures! When you use var in a loop and create closures inside, all closures share the same variable because var is function-scoped (not block-scoped). By the time the callbacks run, the loop is done and the variable holds its final value.",
        code: `// THE BUG — prints 3, 3, 3
for (var i = 0; i < 3; i++) {
  setTimeout(() => console.log(i), 100);
}
// All three closures share the SAME i (var is function-scoped)

// FIX 1: Use let (block-scoped — each iteration gets its OWN i)
for (let i = 0; i < 3; i++) {
  setTimeout(() => console.log(i), 100); // 0, 1, 2 ✓
}

// FIX 2: IIFE to capture i by value
for (var i = 0; i < 3; i++) {
  ((j) => {
    setTimeout(() => console.log(j), 100); // 0, 1, 2 ✓
  })(i);
}

// FIX 3: Factory function
for (var i = 0; i < 3; i++) {
  setTimeout(((j) => () => console.log(j))(i), 100); // 0, 1, 2 ✓
}`,

        code: `// Syntax:
(function() {
  let private = 42;       // not accessible outside
  console.log(private);
})();

// console.log(private);  // ReferenceError!

// Module pattern using IIFE + closure:
const myModule = (function() {
  let _secret = 0;        // truly private

  return {
    getSecret: () => _secret,
    setSecret: (val) => { _secret = val; }
  };
})();

myModule.setSecret(99);
myModule.getSecret(); // 99
myModule._secret;     // undefined — it's private!`

        code: `function createFunctions() {
  let result = [];
  for (var i = 0; i < 3; i++) {

  }

}

const fns = createFunctions();
console.log(fns[0]()); // ?
console.log(fns[1]()); // ?
console.log(fns[2]()); // ?

// OUTPUT: 3, 3, 3
// Why? All three functions close over the SAME i (var).
// By the time any fn is called, the loop completed: i === 3.

// FIX:
function createFunctions() {
  let result = [];
  for (let i = 0; i < 3; i++) {   // let creates a new binding each iteration

        code: `// Partial Application
function multiply(a, b) { return a * b; }

function partial(fn, ...presetArgs) {
  return function(...laterArgs) {       // closes over presetArgs
    return fn(...presetArgs, ...laterArgs);
  };
}

const double = partial(multiply, 2);
const triple = partial(multiply, 3);

double(5); // 10
triple(5); // 15

// Currying with closures:
const curry = (fn) => (a) => (b) => fn(a, b);

const curriedMultiply = curry(multiply);
curriedMultiply(2)(5); // 10
const double2 = curriedMultiply(2);
double2(7); // 14`

      {
        q: "Can closures cause memory leaks? How would you prevent them?",
        answer: "Yes. Since closures hold references to their outer scope variables, those variables are not garbage collected as long as the closure exists. If closures are attached to long-lived objects (like DOM event listeners) and are never removed, they can prevent large objects from being GC'd.",
        code: `// MEMORY LEAK EXAMPLE
function setupButton() {
  const bigData = new Array(1000000).fill('data'); // 1M items
  
  document.getElementById('btn').addEventListener('click', function() {
    // This closure captures bigData — even if we never USE it here
    console.log('clicked');
  });
  // bigData can't be GC'd as long as the event listener exists!
}

// FIX 1: Don't capture unnecessary variables
function setupButton() {
  const bigData = new Array(1000000).fill('data');
  const processed = processData(bigData); // extract what you need
  bigData = null;                         // allow GC

  document.getElementById('btn').addEventListener('click', function() {
    console.log(processed); // only captures the small result
  });
}

// FIX 2: Remove listeners when done
function setup() {
  const handler = () => console.log('click');
  btn.addEventListener('click', handler);
  return () => btn.removeEventListener('click', handler); // cleanup fn
}`,
        tip: "Always ask: 'How long does this closure live? Does it capture large or sensitive data?'"
      },
      {
        q: "How does memoization use closures? Implement a memoize function.",
        answer: "Memoization caches the results of expensive function calls. The closure captures the cache object, which persists between calls but is private to the memoized function.",
        code: `function memoize(fn) {
  const cache = new Map();    // closed over — persists, stays private
  
  return function(...args) {
    const key = JSON.stringify(args);
    
    if (cache.has(key)) {
      console.log('Cache hit!');
      return cache.get(key);
    }
    
    const result = fn.apply(this, args);
    cache.set(key, result);
    return result;
  };
}

// Usage:
function expensiveCalc(n) {
  console.log('Computing...');
  return n * n;
}

const memoized = memoize(expensiveCalc);
memoized(5);  // "Computing..." → 25
memoized(5);  // "Cache hit!"  → 25 (no recompute)
memoized(6);  // "Computing..." → 36`
      },

        q: "Implement the module pattern using closures. What are its advantages?",
        answer: "The Module Pattern uses an IIFE with closures to create a self-contained unit with public and private members — this was the dominant way to organize JS code before ES Modules.",
        code: `const ShoppingCart = (function() {
  // PRIVATE
  let items = [];
  let discount = 0;

  function calcTotal() {
    const raw = items.reduce((sum, item) => sum + item.price, 0);
    return raw * (1 - discount);
  }

  // PUBLIC API
  return {
    addItem(item) {
      items.push(item);
      console.log(\`Added \${item.name}\`);
    },
    applyDiscount(pct) {
      discount = pct / 100;
    },
    checkout() {
      console.log(\`Total: $\${calcTotal().toFixed(2)}\`);
      return calcTotal();
    },
    itemCount: () => items.length
  };
})();

ShoppingCart.addItem({ name: 'Book', price: 20 });
ShoppingCart.addItem({ name: 'Pen', price: 5 });
ShoppingCart.applyDiscount(10);
ShoppingCart.checkout(); // Total: $22.50
ShoppingCart.items;      // undefined — private!`,
        tip: "Advantages: Encapsulation, no global pollution, clear public API, true private state."
      },
      {
        q: "What is a closure's relationship with the call stack and heap?",
        answer: "When a function executes, its frame (local variables) lives on the call stack. Normally, when the function returns, the frame is popped and variables are eligible for GC. But when a closure exists that references those variables, the JavaScript engine moves them to the heap, keeping them alive as long as the closure is reachable.",
        code: `function outer() {
  // When outer() is called, a stack frame is created.
  // 'secret' starts on the stack...
  let secret = 42;

  return function inner() {
    // inner closes over secret.
    // The engine detects this and MOVES secret to the HEAP.
    return secret;
  };
  // outer's stack frame is gone, but 'secret' lives on in the heap
}

const fn = outer();  // outer stack frame popped
fn();                // 42 — secret accessed from heap via closure

// When fn itself is GC'd, secret is finally freed from the heap.`
      },
      {
        q: "Implement a 'once' function using closures — a function that can only be called once.",
        answer: "Classic utility function. The closure captures a flag and the original function, resetting after first call.",
        code: `function once(fn) {
  let called = false;   // closed over
  let result;           // closed over — cache first result

  return function(...args) {
    if (!called) {
      called = true;
      result = fn.apply(this, args);
    }
    return result;      // always returns first call's result
  };
}

const initDB = once(function() {
  console.log('DB initialized!');
  return { connected: true };
});

initDB(); // "DB initialized!" → { connected: true }
initDB(); // (silent)          → { connected: true }
initDB(); // (silent)          → { connected: true }`

      console.log(j);
    }, j * 1000);
  })(i);
}

// Output (one per second): 0, 1, 2, 3, 4

        answer: "Debounce delays a function call until after a specified time has passed since the last invocation. Used heavily in search inputs, window resize handlers, etc.",
        code: `function debounce(fn, delay) {
  let timer = null;    // closed over — persists between calls

  return function(...args) {
    // 'this' is the calling context
    clearTimeout(timer);        // cancel previous scheduled call

    timer = setTimeout(() => {
      fn.apply(this, args);     // calls fn with correct context + args
      timer = null;             // cleanup
    }, delay);
  };
}

// Usage:
const searchAPI = debounce(function(query) {
  console.log('Searching for:', query);
  // fetch('/api/search?q=' + query)
}, 300);

// User types fast — only last call fires after 300ms of silence:
searchAPI('j');      // cancelled
searchAPI('ja');     // cancelled
searchAPI('jav');    // cancelled
searchAPI('java');   // fires after 300ms — "Searching for: java"

// Closed over variables:
// timer — tracks the pending setTimeout ID across calls
// fn    — the original function (from outer scope)
// delay — the wait time (from outer scope)`
      },
      {
        q: "Implement a throttle function using closures.",
        answer: "Throttle ensures a function fires at most once every N milliseconds, no matter how many times it's called. Different from debounce — throttle fires immediately then ignores calls for the delay period.",
        code: `function throttle(fn, limit) {
  let lastCall = 0;       // closed over — timestamp of last invocation

  return function(...args) {
    const now = Date.now();
    
    if (now - lastCall >= limit) {
      lastCall = now;
      return fn.apply(this, args);
    }
    // else: silently drop this call
  };
}

// Usage — scroll handler fires max once per 100ms:
const onScroll = throttle(function() {
  console.log('Scroll position:', window.scrollY);
}, 100);

window.addEventListener('scroll', onScroll);`
      },
      {
        q: "How would you implement a publish-subscribe (event emitter) system using closures?",
        answer: "An event emitter stores listener functions in a closed-over registry — a perfect use case for closure-based private state.",
        code: `function createEventEmitter() {
  const listeners = {};    // closed over — the private registry

  return {
    on(event, fn) {
      if (!listeners[event]) listeners[event] = [];
      listeners[event].push(fn);
      return () => this.off(event, fn); // returns unsubscribe fn!
    },
    off(event, fn) {
      if (listeners[event])
        listeners[event] = listeners[event].filter(f => f !== fn);
    },
    emit(event, ...args) {
      (listeners[event] || []).forEach(fn => fn(...args));
    },
    once(event, fn) {
      const wrapper = (...args) => {
        fn(...args);
        this.off(event, wrapper); // auto-unsubscribe after one call
      };
      this.on(event, wrapper);
    }
  };
}

const emitter = createEventEmitter();
const unsub = emitter.on('login', (user) => console.log('Welcome', user));
emitter.emit('login', 'Alice'); // "Welcome Alice"
unsub();                        // unsubscribe
emitter.emit('login', 'Bob');   // (nothing — Alice's handler removed)`

function createPerson(name) {
  let _age = 0;   // truly private

  return {
    getName: () => name,
    getAge:  () => _age,
    birthday: () => { _age++; }
  };
}

// OBJECT APPROACH — conventionally private (not enforced)
class Person {
  #age = 0;       // ES2022 private field
  constructor(name) { this.name = name; }
  getName() { return this.name; }
  getAge()  { return this.#age; }
  birthday(){ this.#age++; }
}

// When to use closures:
// ✓ Functional programming style
// ✓ Need true privacy (pre-ES2022)
// ✓ Factory functions, partial application
// ✓ One-off objects, no inheritance needed

// When to use classes/objects:
// ✓ Need prototypal inheritance

        code: `// Stale closure bug in React:
function Counter() {
  const [count, setCount] = useState(0);

  useEffect(() => {
    const timer = setInterval(() => {
      // This closure captures count at render time (0)
      // Even as count updates, this sees stale value!
      console.log(count); // Always 0 — stale closure!
    }, 1000);
    return () => clearInterval(timer);
  }, []); // empty deps = closure captures initial render's count

  // FIX: Use functional update (doesn't need to close over count)
  useEffect(() => {
    const timer = setInterval(() => {
      setCount(c => c + 1); // uses latest value from React internals
    }, 1000);
    return () => clearInterval(timer);
  }, []);
}

// useCallback also uses closures:
const handleClick = useCallback(() => {
  console.log(value); // closes over value
}, [value]); // re-created when value changes (new closure)`,
        tip: "Stale closures in React are the #1 hooks pitfall in MAANG interviews. Always mention the dependency array."

  }

          ${codeBlock}
          ${tipBlock}
        </div>
      `;
      
      sec.appendChild(card);
    });
    
    content.appendChild(sec);
  });
}

function toggleCard(id) {
  const body = document.getElementById('body-' + id);
  const toggle = document.getElementById('toggle-' + id);
  if (body.classList.contains('open')) {
    body.classList.remove('open');
    toggle.textContent = '+';
  } else {
    body.classList.add('open');
    toggle.textContent = '−';
  }
}

function showLevel(level) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  renderAll(level);
}

renderAll('all');
</script>
